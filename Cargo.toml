[package]
name = "agent-speak"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "6"
base64 = "0.22"
libc = "0.2"
# кнопка наушников: MPRIS-плеер Омы на сессионной шине (libdbus системы; MIT/Apache-2.0, src/mpris.rs)
dbus = "=0.9.12"
dbus-crossroads = "=0.5.3"

[profile.release]
# паника любого потока завершает службу, и systemd поднимает её (Restart=on-failure): немой демон с мёртвым потоком хуже
panic = "abort"
